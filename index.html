<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destiny轉運站</title>
  <style>
    :root {
      --bg: #f5f2ec;
      --ink: #1d2830;
      --muted: #697179;
      --panel: #fffdf8;
      --line: #ddd5c9;
      --gate: #365f63;
      --gate-soft: #dce9e7;
      --wine: #8b4051;
      --wine-soft: #f2dde3;
      --gold: #9a7834;
      --gold-soft: #f2e8cc;
      --sky: #3e6f92;
      --sky-soft: #dce9f1;
      --shadow: 0 14px 34px rgba(69, 54, 35, .11);
    }

    [data-theme="dark"] {
      --bg: #111617;
      --ink: #f4f1ea;
      --muted: #a9aaa6;
      --panel: #1c2222;
      --line: #343b39;
      --gate: #8fc3bc;
      --gate-soft: #233a38;
      --wine: #e6a2b1;
      --wine-soft: #40242c;
      --gold: #dbc174;
      --gold-soft: #3c3420;
      --sky: #9fc4dd;
      --sky-soft: #223341;
      --shadow: 0 14px 34px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    button, input, select { font: inherit; }

    .mast {
      min-height: 188px;
      display: grid;
      align-content: end;
      gap: 14px;
      padding: 34px 22px 18px;
      color: #fff;
      background:
        linear-gradient(120deg, rgba(17, 32, 33, .88), rgba(64, 92, 91, .52)),
        url("https://images.unsplash.com/photo-1516542076529-1ea3854896f2?auto=format&fit=crop&w=1800&q=80") center/cover;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(32px, 5.5vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
      text-shadow: 0 5px 22px rgba(0, 0, 0, .36);
    }

    .brand-mark {
      display: block;
      margin-top: 5px;
      font-size: .62em;
      line-height: 1;
    }

    .brand p {
      margin: 6px 0 0;
      font-size: 15px;
      font-weight: 700;
      opacity: .92;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .34);
    }

    .searchbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(150px, 190px) 128px 142px 120px 82px 82px;
      gap: 8px;
      width: min(1260px, 100%);
    }

    .input, .select, .btn {
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, .58);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      color: #172327;
      padding: 9px 12px;
      font-size: 16px;
    }

    .btn {
      cursor: pointer;
      font-weight: 700;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .btn.primary {
      background: rgba(255, 255, 255, .92);
      color: #172327;
    }

    .layout {
      width: calc(100% - 28px);
      margin: 16px 14px 44px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .filters {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 14px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .filter-block {
      display: grid;
      gap: 8px;
    }

    .filter-title {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filters .chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .filters .chip {
      width: 100%;
      min-height: 34px;
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .scroll-chips {
      max-height: 154px;
      overflow-y: auto;
      padding-right: 3px;
      align-content: start;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      min-height: 30px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip.active {
      background: var(--gate-soft);
      border-color: color-mix(in srgb, var(--gate) 48%, transparent);
      color: var(--gate);
      font-weight: 700;
    }

    .filter-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      display: grid;
      gap: 12px;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
    }

    .summary h2 {
      margin: 0;
      font-size: 18px;
    }

    .summary .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
      padding: 13px;
      display: grid;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 5px 8px;
      align-items: start;
    }

    .card-title-wrap {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .read-heart {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    .read-heart.done {
      background: var(--wine-soft);
      border-color: color-mix(in srgb, var(--wine) 42%, transparent);
      color: var(--wine);
    }

    .read-heart:hover {
      border-color: var(--wine);
      color: var(--wine);
    }

    .title {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .ko {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .author {
      width: fit-content;
      border: 0;
      background: transparent;
      color: var(--sky);
      padding: 0;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }

    .badges, .item-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
      align-content: flex-start;
    }

    .badge {
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 12px;
      background: var(--gate-soft);
      color: var(--gate);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      min-height: 24px;
      line-height: 1.2;
    }

    .badge.price {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .badge.jewel {
      background: var(--wine-soft);
      color: var(--wine);
    }

    .roles {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 72px;
      overflow: hidden;
    }

    .tag {
      border-radius: 8px;
      background: var(--sky-soft);
      color: var(--sky);
      padding: 3px 6px;
      font-size: 11px;
    }

    .item-link, .item-disabled {
      min-height: 32px;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid var(--line);
    }

    .item-link {
      color: var(--ink);
      background: var(--bg);
    }

    .card .item-link,
    .card .item-disabled {
      height: 34px;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card > .chip {
      height: 34px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-link:hover {
      border-color: var(--gate);
      color: var(--gate);
    }

    .item-disabled {
      color: var(--muted);
      background: color-mix(in srgb, var(--bg) 70%, var(--line));
    }

    .empty {
      padding: 26px;
      text-align: center;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      place-items: center;
      padding: 14px;
      background: rgba(0, 0, 0, .42);
    }

    .modal.open { display: grid; }

    .sheet {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 16px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, .28);
      display: grid;
      gap: 12px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .sheet-head h2 {
      margin: 0;
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    .close {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
    }

    .detail-grid {
      display: grid;
      gap: 7px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      font-size: 14px;
    }

    .detail-row b {
      color: var(--muted);
    }

    .report-form {
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      min-height: 40px;
      padding: 8px 10px;
      font-size: 16px;
    }

    .field textarea {
      min-height: 86px;
      resize: vertical;
    }

    .captcha-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px;
      align-items: end;
    }

    .captcha-code {
      display: grid;
      place-items: center;
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--gate-soft);
      color: var(--gate);
      font-weight: 800;
      letter-spacing: 0;
    }

    .report-status {
      min-height: 22px;
      margin: 0;
      color: var(--wine);
      font-size: 13px;
      font-weight: 700;
    }

    .report-list {
      display: grid;
      gap: 8px;
      margin-top: 2px;
    }

    .report-list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .link-button {
      border: 0;
      background: transparent;
      color: var(--gate);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      padding: 0;
    }

    .report-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      padding: 9px;
      font-size: 13px;
    }

    .report-card b {
      color: var(--gate);
    }

    .report-card p {
      margin: 4px 0 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .calc-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .calc-total {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--gate-soft);
      color: var(--gate);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      font-weight: 800;
    }

    .calc-list {
      display: grid;
      gap: 7px;
      max-height: 52vh;
      overflow: auto;
      padding-right: 3px;
    }

    .calc-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      padding: 9px;
    }

    .calc-row input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--gate);
    }

    .calc-name {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .calc-title {
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .calc-meta {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .calc-points {
      color: var(--gold);
      font-weight: 800;
      white-space: nowrap;
    }

    .calc-selected {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      padding: 9px 10px;
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .calc-selected b {
      color: var(--ink);
    }

    .calc-selected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .source-credit {
      width: min(1260px, 100%);
      color: rgba(255, 255, 255, .86);
      font-size: 13px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .28);
    }

    .source-credit a {
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .source-credit a:hover {
      text-decoration: underline;
    }

    .site-updated {
      margin-top: 4px;
      color: rgba(255, 255, 255, .78);
      font-size: 12px;
    }

    .top-button {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 30;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--gate);
      color: #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 20px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .top-button.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @media (max-width: 1120px) and (min-width: 821px) {
      .layout {
        grid-template-columns: 300px minmax(0, 1fr);
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .mast {
        min-height: 220px;
        padding: 26px 14px 14px;
      }

      .searchbar {
        grid-template-columns: 1fr 1fr;
      }

      .searchbar .input {
        grid-column: 1 / -1;
      }

      .searchbar .select:first-of-type {
        grid-column: 1 / -1;
      }

      .captcha-row {
        grid-template-columns: 1fr;
      }

      .calc-tools {
        grid-template-columns: 1fr;
      }

      .calc-row {
        grid-template-columns: 22px minmax(0, 1fr);
      }

      .top-button {
        right: 12px;
        bottom: 12px;
        width: 40px;
        height: 40px;
      }

      .calc-points {
        grid-column: 2;
      }

      .layout {
        width: calc(100% - 20px);
        margin: 10px 10px 34px;
        grid-template-columns: 1fr;
      }

      .filters {
        position: static;
        max-height: none;
        overflow-y: visible;
      }

      .scroll-chips {
        max-height: 126px;
      }

      .summary {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="mast">
    <div class="brand">
      <h1>Destiny轉運站<span class="brand-mark">🐶🍵💚🐰</span></h1>
      <p>Postype Index</p>
    </div>
    <div class="searchbar">
      <input class="input" id="search" type="search" placeholder="搜尋篇名 / 作者 / 角色 / 標籤">
      <select class="select" id="authorSelect" aria-label="作者篩選">
        <option value="">全部作者</option>
      </select>
      <select class="select" id="purchase">
        <option value="全部">全部</option>
        <option value="是">收費</option>
        <option value="否">免費</option>
      </select>
      <select class="select" id="sort">
        <option value="newest">最新新增</option>
        <option value="author">作者排序</option>
        <option value="title">篇名排序</option>
        <option value="price-desc">點數高到低</option>
        <option value="items-desc">項目多到少</option>
      </select>
      <button class="btn primary" id="randomBtn" type="button">隨機看一篇</button>
      <button class="btn primary" id="calculatorBtn" type="button">計算機</button>
      <button class="btn" id="languageBtn" type="button">简体</button>
      <button class="btn" id="theme" type="button">深色</button>
    </div>
    <div class="source-credit">
      實名感謝鳳梨，標籤分類參考資料庫：
      <a href="https://yashen0512.github.io/Annyeongz/" target="_blank" rel="noopener">Annyeongz平行宇宙</a>
      <div class="site-updated">最新更新時間：2026-08-01 22:56</div>
    </div>
  </header>

  <div class="layout">
    <aside class="panel filters">
      <section class="filter-block">
        <h2 class="filter-title">蓋瑞的珠寶盒</h2>
        <div class="chips scroll-chips" id="jewelChips"></div>
      </section>
      <section class="filter-block">
        <h2 class="filter-title">我的標記</h2>
        <div class="chips" id="readChips"></div>
      </section>
      <section class="filter-block">
        <h2 class="filter-title">整理</h2>
        <div class="chips" id="uncategorizedChips"></div>
      </section>
      <section class="filter-block">
        <h2 class="filter-title">分級</h2>
        <div class="chips" id="ratingChips"></div>
      </section>
      <section class="filter-block">
        <h2 class="filter-title">形式 / 性質</h2>
        <div class="chips" id="formatChips"></div>
      </section>
      <section class="filter-block">
        <h2 class="filter-title">文章類型</h2>
        <div class="chips" id="typeChips"></div>
      </section>
      <section class="filter-block">
        <h2 class="filter-title">結局</h2>
        <div class="chips" id="endingChips"></div>
      </section>
    </aside>

    <main class="content">
      <section class="panel summary">
        <div>
          <h2 id="resultTitle">全部作品</h2>
          <div class="meta" id="countText"></div>
        </div>
        <div class="chips" id="activeChips"></div>
      </section>
      <section class="grid" id="grid"></section>
    </main>
  </div>

  <button class="top-button" id="topButton" type="button" aria-label="回到最上面">↑</button>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="modalTitle"></h2>
        <button class="close" id="closeBtn" type="button" aria-label="關閉">×</button>
      </div>
      <div class="ko" id="modalKo"></div>
      <div class="detail-grid" id="modalDetails"></div>
      <div class="item-list" id="modalItems"></div>
    </div>
  </div>

  <div class="modal" id="calculatorModal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2>點數計算機</h2>
        <button class="close" id="calculatorCloseBtn" type="button" aria-label="關閉">×</button>
      </div>
      <div class="calc-tools">
        <input class="input" id="calculatorSearch" type="search" placeholder="搜尋篇名 / 作者 / 集數">
        <button class="chip" id="calculatorClearBtn" type="button">清空</button>
      </div>
      <div class="calc-total">
        <span id="calculatorCount">已選 0 部作品</span>
        <span id="calculatorTotal">0p</span>
      </div>
      <div class="calc-selected" id="calculatorSelectedBox">
        <b>已選作品</b>
        <div class="calc-selected-list" id="calculatorSelectedList">尚未選擇</div>
      </div>
      <div class="calc-list" id="calculatorList"></div>
    </div>
  </div>

  <script src="destiny-data.js?v=20260801-postype-only-final"></script>
  <script>
    const DATA = window.DESTINY_DATA || { works: [] };
    const CALCULATOR_KEY = "destinyCalculatorSelection";
    const READ_KEY = "destinyReadWorks";
    const LANGUAGE_KEY = "destinyLanguage";
    const works = (DATA.works || []).filter(work => work.purchase !== "已刪文");
    const state = {
      q: "",
      purchase: "全部",
      sort: "newest",
      author: "",
      tags: new Set(),
      jewel: "",
      readOnly: false,
      uncategorized: false,
      calculatorQ: "",
      calculatorSelected: loadCalculatorSelection(),

    function toSimplified(value) {
      let text = String(value ?? "");
      SIMPLIFIED_PHRASES.forEach(([trad, simp]) => {
        text = text.split(trad).join(simp);
      });
      return [...text].map(char => SIMPLIFIED_CHAR_MAP[char] || char).join("");
    }

    function displayText(value) {
      return state.language === "zh-Hans" ? toSimplified(value) : String(value ?? "");
    }

    function languageSearchText(value) {
      const text = String(value ?? "").toLowerCase();
      return `${text} ${toSimplified(text).toLowerCase()}`;
    }

    function applyLanguage(root = document.body) {
      const simplified = state.language === "zh-Hans";
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const tag = node.parentElement?.tagName;
          return ["SCRIPT", "STYLE", "NOSCRIPT"].includes(tag) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        }
      });
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach(node => {
        if (node._destinyOriginalText === undefined) node._destinyOriginalText = node.nodeValue;
        node.nodeValue = simplified ? toSimplified(node._destinyOriginalText) : node._destinyOriginalText;
      });
      root.querySelectorAll("[placeholder], [aria-label], [title]").forEach(node => {
        node._destinyOriginalAttrs = node._destinyOriginalAttrs || {};
        ["placeholder", "aria-label", "title"].forEach(attr => {
          if (!node.hasAttribute(attr)) return;
          if (node._destinyOriginalAttrs[attr] === undefined) node._destinyOriginalAttrs[attr] = node.getAttribute(attr);
          const original = node._destinyOriginalAttrs[attr];
          node.setAttribute(attr, simplified ? toSimplified(original) : original);
        });
      });
      document.documentElement.lang = state.language;
      el.languageBtn.textContent = simplified ? "繁体" : "简体";
    }

    function setLanguage(language) {
      state.language = language;
      localStorage.setItem(LANGUAGE_KEY, language);
      renderFilters();
      renderCards();
      if (el.calculatorModal.classList.contains("open")) renderCalculator();
      applyLanguage();
    }

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.dataset.theme = theme;
      el.theme.textContent = theme === "dark" ? "淺色" : "深色";
      localStorage.setItem("destinyTheme", theme);
    }

    function tagValues(type) {
      const counts = new Map();
      works.forEach(work => {
        const group = (work.tagGroups || []).find(item => item.type === type);
        (group?.values || []).forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
      });
      return [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hant"))
        .slice(0, 18);
    }

    function authorValues() {
      const counts = new Map();
      works.forEach(work => counts.set(work.author || "未填", (counts.get(work.author || "未填") || 0) + 1));
      return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hant"));
    }

    function chipHtml(value, count, kind) {
      const active = kind === "jewel" ? state.jewel === value : state.tags.has(value);
      return `<button class="chip ${active ? "active" : ""}" type="button" data-kind="${kind}" data-value="${escapeHtml(value)}">${escapeHtml(value)} · ${count}</button>`;
    }

    function jewelValues() {
      const counts = new Map();
      works.forEach(work => {
        (work.thumbCategories || []).forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
      });
      return [...counts.entries()].sort((a, b) => {
        const order = ["最強推", "作家全系列", "推推", "季刊"];
        const ia = order.indexOf(a[0]);
        const ib = order.indexOf(b[0]);
        if (ia !== ib) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        return a[0].localeCompare(b[0], "zh-Hant");
      });
    }

    function isUncategorized(work) {
      return !String(work.roles || "").trim() && !(work.flatTags || []).length;
    }

    function totalPointLabel(work) {
      return `${Number(work.totalPoints) || 0}p`;
    }

    function episodeCountLabel(count) {
      return count === 1 ? "單集" : `${count}集`;
    }

    function loadCalculatorSelection() {
      try {
        return new Set(JSON.parse(localStorage.getItem(CALCULATOR_KEY) || "[]"));
      } catch {
        return new Set();
      }
    }

    function loadReadWorks() {
      try {
        return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]"));
      } catch {
        return new Set();
      }
    }

    function saveReadWorks() {
      localStorage.setItem(READ_KEY, JSON.stringify([...state.readWorks]));
    }

    function readHeartLabel(work) {
      return state.readWorks.has(work.id) ? `取消已看完：${work.zh}` : `標記已看完：${work.zh}`;
    }

    function isMixedCp(work) {
      return (work.thumbCategories || []).some(category => String(category).includes("雜食"));
    }

    function calculatorItems() {
      return works
        .filter(work => Number.isFinite(work.totalPoints) && work.totalPoints > 0)
        .filter(work => !isMixedCp(work))
        .map(work => ({
          id: work.id,
          workTitle: work.zh,
          ko: work.ko,
          author: work.author || "未填作者",
          points: work.totalPoints,
          items: visibleItems(work).length,
          searchText: languageSearchText(`${work.zh} ${work.ko} ${work.author || ""}`),
        }));
    }

    function saveCalculatorSelection() {
      localStorage.setItem(CALCULATOR_KEY, JSON.stringify([...state.calculatorSelected]));
    }

    function renderCalculator() {
      const allRows = calculatorItems();
      const q = state.calculatorQ.trim().toLowerCase();
      const qSimplified = toSimplified(q).toLowerCase();
      const rows = allRows.filter(item => !q || item.searchText.includes(q) || item.searchText.includes(qSimplified));
      const selectedRows = allRows.filter(item => state.calculatorSelected.has(item.id));
      const total = selectedRows.reduce((sum, item) => sum + item.points, 0);

      el.calculatorCount.textContent = `已選 ${selectedRows.length} 部作品`;
      el.calculatorTotal.textContent = `${total}p`;
      el.calculatorSelectedList.innerHTML = selectedRows.length
        ? selectedRows.map(item => `<span class="tag">${escapeHtml(item.workTitle)} · ${escapeHtml(item.points)}p</span>`).join("")
        : "尚未選擇";

      if (!rows.length) {
        el.calculatorList.innerHTML = `<div class="empty">沒有符合的付費作品</div>`;
        applyLanguage(el.calculatorModal);
        return;
      }

      el.calculatorList.innerHTML = rows.map(item => `
        <label class="calc-row">
          <input type="checkbox" data-calc-id="${escapeHtml(item.id)}" ${state.calculatorSelected.has(item.id) ? "checked" : ""}>
            <span class="calc-name">
              <span class="calc-title">${escapeHtml(item.workTitle)}</span>
            <span class="calc-meta">${escapeHtml(item.author)} · 全部 ${escapeHtml(episodeCountLabel(item.items))}</span>
          </span>
          <span class="calc-points">${escapeHtml(item.points)}p</span>
        </label>
      `).join("");
      applyLanguage(el.calculatorModal);
    }

    function openCalculator() {
      renderCalculator();
      el.calculatorModal.classList.add("open");
      el.calculatorModal.setAttribute("aria-hidden", "false");
      el.calculatorSearch.focus();
    }

    function closeCalculator() {
      el.calculatorModal.classList.remove("open");
      el.calculatorModal.setAttribute("aria-hidden", "true");
    }

    function renderUncategorized() {
      const count = works.filter(isUncategorized).length;
      el.uncategorizedChips.innerHTML =
        `<button class="chip ${state.uncategorized ? "active" : ""}" type="button" data-kind="uncategorized" data-value="未分類">未分類 · ${count}</button>`;
    }

    function renderReadFilter() {
      const count = works.filter(work => state.readWorks.has(work.id)).length;
      el.readChips.innerHTML =
        `<button class="chip ${state.readOnly ? "active" : ""}" type="button" data-kind="read" data-value="已標記">📎已標記 · ${count}</button>`;
    }

    function renderAuthorSelect() {
      const selected = state.author;
      el.authorSelect.innerHTML = `<option value="">全部作者</option>` + authorValues().map(([value, count]) =>
        `<option value="${escapeHtml(value)}" ${selected === value ? "selected" : ""}>${escapeHtml(value)} · ${count}</option>`
      ).join("");
    }

    function renderFilters() {
      renderAuthorSelect();
      const jewelCount = works.filter(work => (work.thumbCategories || []).length).length;
      el.jewelChips.innerHTML =
        `<button class="chip ${state.jewel === "全部推薦" ? "active" : ""}" type="button" data-kind="jewel" data-value="全部推薦">全部推薦 · ${jewelCount}</button>` +
        jewelValues().map(([value, count]) => chipHtml(value, count, "jewel")).join("");
      renderReadFilter();
      renderUncategorized();
      el.ratingChips.innerHTML = tagValues("分級").map(([value, count]) => chipHtml(`分級: ${value}`, count, "tag")).join("");
      el.formatChips.innerHTML = tagValues("形式/性質").map(([value, count]) => chipHtml(`形式/性質: ${value}`, count, "tag")).join("");
      el.typeChips.innerHTML = tagValues("文章類型").map(([value, count]) => chipHtml(`文章類型: ${value}`, count, "tag")).join("");
      el.endingChips.innerHTML = tagValues("結局").map(([value, count]) => chipHtml(`結局: ${value}`, count, "tag")).join("");
      applyLanguage();
    }

    function itemLabel(item) {
      const part = item.part && item.part !== "本篇" ? item.part : "本篇";
      const points = pointLabel(item);
      return points ? `${part} · ${points}` : part;
    }

    function pointLabel(item) {
      if (Number.isFinite(item.points) && item.points > 0) return `${item.points}p`;
      return item.purchaseLabel || "";
    }

    function itemLink(item) {
      if (!item.url) return `<span class="item-disabled">${escapeHtml(itemLabel(item))}</span>`;
      return `<a class="item-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(itemLabel(item))}</a>`;
    }

    function visibleItems(work) {
      return (work.items || []).filter(item => item.purchase !== "已刪文");
    }

    function priceClass(work) {
      if (work.purchase === "是") return "price";
      return "";
    }

    function visibleWorks() {
      const q = state.q.trim().toLowerCase();
      let items = works.filter(work => {
        const mixedOK = !isMixedCp(work) || state.tags.has("雜食系 (其他CP)");
        if (q && !languageSearchText(work.searchText).includes(toSimplified(q).toLowerCase()) && !languageSearchText(work.searchText).includes(q)) return false;
        if (!mixedOK) return false;
        if (state.purchase !== "全部" && work.purchase !== state.purchase) return false;
        if (state.author && work.author !== state.author) return false;
        if (state.jewel === "全部推薦" && !(work.thumbCategories || []).length) return false;
        if (state.jewel && state.jewel !== "全部推薦" && !(work.thumbCategories || []).includes(state.jewel)) return false;
        if (state.readOnly && !state.readWorks.has(work.id)) return false;
        if (state.uncategorized && !isUncategorized(work)) return false;
        for (const tag of state.tags) {
          if (!(work.flatTags || []).includes(tag)) return false;
        }
        return true;
      });

      items = [...items].sort((a, b) => {
        if (state.sort === "title") return a.zh.localeCompare(b.zh, "zh-Hant");
        if (state.sort === "price-desc") return b.totalPoints - a.totalPoints || a.zh.localeCompare(b.zh, "zh-Hant");
        if (state.sort === "items-desc") return b.items.length - a.items.length || a.zh.localeCompare(b.zh, "zh-Hant");
        if (state.sort === "newest") return (b.sourceRow || 0) - (a.sourceRow || 0) || a.zh.localeCompare(b.zh, "zh-Hant");
        return a.author.localeCompare(b.author, "zh-Hant") || a.zh.localeCompare(b.zh, "zh-Hant");
      });
      return items;
    }

    function renderActive() {
      const chips = [];
      if (state.author) chips.push({ kind: "author", value: state.author, label: state.author });
      if (state.jewel) chips.push({ kind: "jewel", value: state.jewel, label: `蓋瑞的珠寶盒: ${state.jewel}` });
      if (state.readOnly) chips.push({ kind: "read", value: "已標記", label: "已標記" });
      if (state.uncategorized) chips.push({ kind: "uncategorized", value: "未分類", label: "未分類" });
      state.tags.forEach(tag => chips.push({ kind: "tag", value: tag, label: tag }));
      el.activeChips.innerHTML = chips.map(({ kind, value, label }) =>
        `<button class="chip active" type="button" data-kind="${kind}" data-value="${escapeHtml(value)}">${escapeHtml(label)} ×</button>`
      ).join("");
    }

    function renderCards() {
      const items = visibleWorks();
      el.resultTitle.textContent = state.jewel ? `蓋瑞的珠寶盒 · ${state.jewel}` : state.author || "全部作品";
      el.countText.textContent = `${items.length} / ${works.length} 組作品`;
      renderActive();

      if (!items.length) {
        el.grid.innerHTML = `<div class="panel empty">沒有符合的作品</div>`;
        applyLanguage();
        return;
      }

      el.grid.innerHTML = items.map(work => {
        const links = visibleItems(work);
        return `
          <article class="card">
            <div class="card-head">
              <div class="card-title-wrap">
                <h3 class="title">${work.purchase === "是" ? "💰 " : ""}${escapeHtml(work.zh)}</h3>
                <div class="ko">${escapeHtml(work.ko)}</div>
                <button class="author" type="button" data-author="${escapeHtml(work.author)}">${escapeHtml(work.author || "未填作者")}</button>
              </div>
              <button class="read-heart ${state.readWorks.has(work.id) ? "done" : ""}" type="button" data-read="${escapeHtml(work.id)}" aria-label="${escapeHtml(readHeartLabel(work))}" title="${escapeHtml(readHeartLabel(work))}">📎</button>
            </div>
            <div class="badges">
              <span class="badge ${priceClass(work)}">${escapeHtml(work.purchaseLabel)}</span>
              <span class="badge">${escapeHtml(episodeCountLabel(links.length))}</span>
              ${(work.thumbCategories || []).length ? `<span class="badge jewel">${escapeHtml(work.thumbCategories[0])}</span>` : ""}
            </div>
            ${work.roles ? `<p class="roles">${escapeHtml(work.roles)}</p>` : ""}
            <div class="tags">${(work.flatTags || []).slice(0, 9).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
            <div class="item-list">${links.slice(0, 4).map(itemLink).join("")}${links.length > 4 ? `<button class="item-link" type="button" data-detail="${escapeHtml(work.id)}">全部 ${escapeHtml(episodeCountLabel(links.length))}</button>` : ""}</div>
            <button class="chip" type="button" data-detail="${escapeHtml(work.id)}">詳細</button>
          </article>
        `;
      }).join("");
      applyLanguage();
    }

    function openDetail(id) {
      const work = works.find(item => item.id === id);
      if (!work) return;
      el.modalTitle.textContent = work.zh;
      el.modalKo.textContent = work.ko;
      const groups = (work.tagGroups || []).map(group => `${group.type}: ${group.values.join("、")}`).join("；");
      el.modalDetails.innerHTML = [
        ["作者", work.author],
        ["總金額", totalPointLabel(work)],
        ["珠寶盒", (work.thumbCategories || []).join("、")],
        ["角色", work.roles],
        ["標籤", groups],
      ].filter(([, value]) => value).map(([key, value]) => `
        <div class="detail-row"><b>${escapeHtml(key)}</b><span>${escapeHtml(value)}</span></div>
      `).join("");
      el.modalItems.innerHTML = visibleItems(work).map(item => {
        const points = pointLabel(item);
        const label = `${item.part || "本篇"} · ${item.zh}${points ? ` · ${points}` : ""}`;
        if (!item.url) return `<span class="item-disabled">${escapeHtml(label)}</span>`;
        return `<a class="item-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
      }).join("");
      el.modal.classList.add("open");
      el.modal.setAttribute("aria-hidden", "false");
      applyLanguage(el.modal);
    }

    function randomWork() {
      const items = visibleWorks().filter(work => !isMixedCp(work) && visibleItems(work).some(item => item.url));
      if (!items.length) {
        el.countText.textContent = "目前篩選條件沒有可傳送的作品";
        return;
      }
      const work = items[Math.floor(Math.random() * items.length)];
      openDetail(work.id);
    }

    function clearTopFilters() {
      state.q = "";
      state.author = "";
      state.purchase = "全部";
      state.sort = "newest";
      el.search.value = "";
      el.authorSelect.value = "";
      el.purchase.value = "全部";
      el.sort.value = "newest";
    }

    function clearFilter(kind, value) {
      if (kind === "author") state.author = "";
      if (kind === "tag") state.tags.delete(value);
      if (kind === "jewel") state.jewel = "";
      if (kind === "read") state.readOnly = false;
      if (kind === "uncategorized") state.uncategorized = false;
      renderFilters();
      renderCards();
    }

    document.addEventListener("click", event => {
      const chip = event.target.closest("[data-kind]");
      if (chip) {
        const kind = chip.dataset.kind;
        const value = chip.dataset.value;
        if (kind === "tag") {
          clearTopFilters();
          state.jewel = "";
          state.readOnly = false;
          state.uncategorized = false;
          if (state.tags.has(value)) {
            state.tags.delete(value);
          } else {
            state.tags.clear();
            state.tags.add(value);
          }
        }
        if (kind === "uncategorized") {
          clearTopFilters();
          state.jewel = "";
          state.readOnly = false;
          state.tags.clear();
          state.uncategorized = !state.uncategorized;
        }
        if (kind === "jewel") {
          clearTopFilters();
          state.tags.clear();
          state.readOnly = false;
          state.uncategorized = false;
          state.jewel = state.jewel === value ? "" : value;
        }
        if (kind === "read") {
          clearTopFilters();
          state.tags.clear();
          state.jewel = "";
          state.uncategorized = false;
          state.readOnly = !state.readOnly;
        }
        renderFilters();
        renderCards();
      }

      const author = event.target.closest("[data-author]");
      if (author) {
        state.author = author.dataset.author;
        renderFilters();
        renderCards();
        window.scrollTo({ top: 180, behavior: "smooth" });
      }

      const detail = event.target.closest("[data-detail]");
      if (detail) openDetail(detail.dataset.detail);

      const read = event.target.closest("[data-read]");
      if (read) {
        if (state.readWorks.has(read.dataset.read)) {
          state.readWorks.delete(read.dataset.read);
        } else {
          state.readWorks.add(read.dataset.read);
        }
        saveReadWorks();
        renderFilters();
        renderCards();
      }

      const calcInput = event.target.closest("[data-calc-id]");
      if (calcInput) {
        if (calcInput.checked) {
          state.calculatorSelected.add(calcInput.dataset.calcId);
        } else {
          state.calculatorSelected.delete(calcInput.dataset.calcId);
        }
        saveCalculatorSelection();
        renderCalculator();
      }
    });

    el.search.addEventListener("input", event => {
      state.q = event.target.value;
      renderCards();
    });

    el.authorSelect.addEventListener("change", event => {
      state.author = event.target.value;
      renderCards();
    });

    el.purchase.addEventListener("change", event => {
      state.purchase = event.target.value;
      renderCards();
    });

    el.sort.addEventListener("change", event => {
      state.sort = event.target.value;
      renderCards();
    });

    el.randomBtn.addEventListener("click", randomWork);
    el.topButton.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    window.addEventListener("scroll", () => {
      el.topButton.classList.toggle("show", window.scrollY > 360);
    }, { passive: true });
    el.calculatorBtn.addEventListener("click", openCalculator);
    el.languageBtn.addEventListener("click", () => setLanguage(state.language === "zh-Hans" ? "zh-Hant" : "zh-Hans"));
    el.calculatorSearch.addEventListener("input", event => {
      state.calculatorQ = event.target.value;
      renderCalculator();
    });
    el.calculatorClearBtn.addEventListener("click", () => {
      state.calculatorSelected.clear();
      saveCalculatorSelection();
      renderCalculator();
    });
    el.theme.addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));
    el.closeBtn.addEventListener("click", () => {
      el.modal.classList.remove("open");
      el.modal.setAttribute("aria-hidden", "true");
    });
    el.modal.addEventListener("click", event => {
      if (event.target === el.modal) el.closeBtn.click();
    });
    el.calculatorCloseBtn.addEventListener("click", closeCalculator);
    el.calculatorModal.addEventListener("click", event => {
      if (event.target === el.calculatorModal) closeCalculator();
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") el.closeBtn.click();
      if (event.key === "Escape") closeCalculator();
    });

    setTheme(state.theme);
    renderFilters();
    renderCards();
    applyLanguage();
  </script>
</body>
</html>
